<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopy Trend – Business Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#000;
  --s1:#111;
  --s2:#1a1a1a;
  --line:#2a2a2a;
  --tx:#f3f3f1;
  --mu:#9a9a9a;
  --ac:#e6e8ec;
  --ok:#8fc4a8;
  --bad:#d68a82;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* En-tête / logo */
header{padding:22px 20px 8px;text-align:center}
.brand{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.brand .name{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.14em;line-height:1}
.brand svg{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.brand .sub{font-size:12px;color:var(--mu);letter-spacing:.06em}

/* Navigation : barre basse sur mobile */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#000;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;color:var(--mu);font-size:11.5px;font-weight:500;border-radius:8px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--tx)}
nav button[aria-current="page"] svg{stroke:var(--ac)}

main{max-width:1000px;margin:0 auto;padding:12px 20px 120px}
section.blk{padding:26px 0;border-top:1px solid var(--line)}
section.blk:first-of-type{border-top:0}
h1,h2{font-family:var(--serif);font-weight:600;margin:0}
h1{font-size:34px;line-height:1.1}
h2{font-size:24px;line-height:1.15;margin-bottom:14px}
.muted{color:var(--mu)}
.small{font-size:13px}

/* Hero */
.hero{padding:18px 0 26px}
.hero .lbl{color:var(--mu);font-size:14px}
.hero .big{font-family:var(--serif);font-weight:600;font-size:clamp(46px,13vw,84px);line-height:1;margin:6px 0 4px;letter-spacing:.01em}
.hero .big small{font-size:.38em;letter-spacing:.06em;margin-left:6px;color:var(--mu);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:14px;max-width:100%;overflow-x:auto}
.seg button{background:none;border:0;padding:7px 14px;border-radius:999px;color:var(--mu);font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ac);color:#000;font-weight:600}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metrics>div{padding:16px 12px 16px 0}
.metrics>div+div{padding-left:14px;border-left:1px solid var(--line)}
.metrics .v{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.1}
.metrics .k{color:var(--mu);font-size:12.5px;margin-top:2px}

.cols{display:grid;gap:0 40px;grid-template-columns:1fr}
@media(min-width:760px){.cols{grid-template-columns:1fr 1fr}}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .a{font-weight:500}
.row .b{color:var(--mu);font-size:13px;white-space:nowrap}
.alert{color:var(--bad)}

/* Graphique */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mu);font-family:var(--sans);font-size:10px;text-anchor:middle}
.chart .val{fill:var(--tx);font-size:10px}

/* Badges statut */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.st-attente{color:var(--mu);border-color:#555}
.st-payee{background:var(--ac);color:#000;border-color:var(--ac)}
.st-livree{color:var(--ok);border-color:var(--ok)}
.st-annulee{color:var(--bad);border-color:var(--bad);text-decoration:line-through}

/* Commandes */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.input,select.input{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%;min-height:44px}
.input::placeholder{color:#666}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chips button{background:none;border:1px solid var(--line);color:var(--mu);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ac);color:#000;border-color:var(--ac);font-weight:600}
.ord{padding:16px 0;border-bottom:1px solid var(--line)}
.ord-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ord-top strong{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.03em}
.ord .cl{font-weight:600;margin-top:2px}
.ord .it{color:var(--mu);font-size:13.5px}
.ord-bot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.ord-bot .amt{font-family:var(--serif);font-size:22px;font-weight:600;margin-right:auto}
.ord-bot select{background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;min-height:38px}

.btn{background:var(--ac);color:#000;border:0;border-radius:12px;padding:13px 20px;font-weight:700;min-height:46px}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.small{padding:8px 14px;min-height:38px;font-size:13px;border-radius:999px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}

/* Stocks */
.prod{padding:16px 0;border-bottom:1px solid var(--line)}
.prod-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.prod-top .nm{font-weight:600}
.prod-top .pr{color:var(--mu);font-size:13px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{background:none;border:0;width:40px;height:40px;font-size:20px;line-height:1;border-radius:999px}
.qty span{min-width:34px;text-align:center;font-family:var(--serif);font-size:22px;font-weight:600}
.qty.low span{color:var(--bad)}
.edit{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit .full{grid-column:1/-1}
.edit .act{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}

/* Formulaire */
form,.form{display:grid;gap:16px}
.field label{display:block;font-size:13.5px;color:var(--mu);margin-bottom:6px}
.line{display:grid;grid-template-columns:1fr 84px auto;gap:10px;align-items:end}
.line .sub{grid-column:1/-1;color:var(--mu);font-size:13px;margin-top:-4px}
.two{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.total .v{font-family:var(--serif);font-size:32px;font-weight:600}
.err{color:var(--bad);font-size:14px;min-height:20px}
.done{border:1px solid var(--ac);border-radius:14px;padding:18px;margin-bottom:18px}
.done .no{font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:.04em;line-height:1.1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#000;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.empty{padding:26px 0;color:var(--mu)}
.foot{color:#666;font-size:12.5px;text-align:center;padding:10px 20px 0}

@media(min-width:900px){
  header{padding-top:34px}
  nav{position:static;justify-content:center;gap:6px;border:0;border-bottom:1px solid var(--line);padding:8px 0;background:var(--bg)}
  nav button{flex:0 0 auto;flex-direction:row;gap:8px;padding:10px 22px;font-size:14px}
  main{padding-bottom:60px}
  .toast{bottom:30px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="name">Shopy Trend</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l-1 11H6z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg>
    <span class="sub">Business manager</span>
  </div>
</header>
<nav id="nav" aria-label="Navigation principale"></nav>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var KEY="shopy-trend-manager-v2", DAY=86400000, mem=null;
var STATUTS=["En attente","Payée","Livrée","Annulée"];
var PAIEMENTS=["M-Pesa","Airtel Money","Orange Money","Cash"];
var ICONS={
  overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  orders:'<path d="M6 3h12l2 4v14H4V7z"/><path d="M4 7h16"/><path d="M9 11a3 3 0 0 0 6 0"/>',
  stock:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4"/><path d="M12 11v10"/>',
  add:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>'
};
var TABS=[["overview","Vue d'ensemble"],["orders","Commandes"],["stock","Stocks"],["add","Ajouter une vente"]];

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return Math.round(n).toLocaleString("fr-FR")+" FC"}
function compact(n){return n>=1000?Math.round(n/1000)+"k":String(Math.round(n))}
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x.getTime()}
function fdate(iso){return new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function stClass(s){return {"En attente":"st-attente","Payée":"st-payee","Livrée":"st-livree","Annulée":"st-annulee"}[s]}
function pad(n){return String(n).padStart(4,"0")}

/* ---------- Données ---------- */
function demo(){
  var P=[
    {id:"p1",name:"Polo noir classique",price:25000,stock:14,min:5},
    {id:"p2",name:"Chemise blanche slim",price:35000,stock:9,min:4},
    {id:"p3",name:"Casquette brodée",price:12000,stock:3,min:5},
    {id:"p4",name:"Totebag noir",price:8000,stock:22,min:6},
    {id:"p5",name:"Ceinture en cuir",price:18000,stock:6,min:3}
  ];
  function find(id){return P.filter(function(p){return p.id===id})[0]}
  function mk(seq,ago,client,pay,status,lines){
    var items=lines.map(function(l){var p=find(l[0]);return {pid:p.id,name:p.name,qty:l[1],price:p.price}});
    var t=Math.min(Date.now(),sod(Date.now())-ago*DAY+(9+seq%8)*3600000);
    return {id:"o"+seq,no:"ST-"+pad(seq),date:new Date(t).toISOString(),client:client,phone:"",items:items,
      total:items.reduce(function(s,i){return s+i.qty*i.price},0),pay:pay,status:status};
  }
  var O=[
    mk(1,8,"Grace M.","Airtel Money","Livrée",[["p1",2]]),
    mk(2,6,"Patrick K.","M-Pesa","Livrée",[["p2",1],["p4",1]]),
    mk(3,5,"Sarah L.","Cash","Livrée",[["p3",2]]),
    mk(4,4,"Jonathan B.","Orange Money","Payée",[["p1",1],["p5",1]]),
    mk(5,3,"Naomie T.","M-Pesa","Livrée",[["p4",3]]),
    mk(6,2,"Junior L.","Airtel Money","Payée",[["p2",2]]),
    mk(7,1,"Dieudonné M.","M-Pesa","En attente",[["p1",1],["p3",1]]),
    mk(8,1,"Esther N.","Cash","Annulée",[["p5",2]]),
    mk(9,0,"Merveille K.","Orange Money","En attente",[["p4",2]]),
    mk(10,0,"Gloire P.","M-Pesa","Payée",[["p1",2]])
  ];
  return {products:P,orders:O,seq:11};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.products&&d.orders)return d}}catch(e){}
  return mem;
}
var S=load()||demo();
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var ui={view:"overview",period:"7",q:"",filter:"Tous",armed:"",edit:"",last:"",error:""};
var D=freshDraft();
function freshDraft(){return {client:"",phone:"",lines:[{pid:"",qty:1}],pay:"M-Pesa",status:"Payée"}}

/* ---------- Utilitaires métier ---------- */
function prod(id){return S.products.filter(function(p){return p.id===id})[0]}
function inPeriod(o){
  if(ui.period==="all")return true;
  var n=ui.period==="today"?1:parseInt(ui.period,10);
  return new Date(o.date).getTime()>=sod(Date.now())-(n-1)*DAY;
}
function paid(o){return o.status==="Payée"||o.status==="Livrée"}
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function summary(o){return o.items.map(function(i){return i.qty+" × "+i.name}).join(", ")}
function changeStock(order,sign){
  order.items.forEach(function(i){var p=prod(i.pid);if(p)p.stock=Math.max(0,p.stock+sign*i.qty)});
}
function toast(msg){
  var t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on")},2200);
}

/* ---------- Vues ---------- */
function vOverview(){
  var ord=S.orders.filter(inPeriod), live=ord.filter(function(o){return o.status!=="Annulée"});
  var enc=sum(ord.filter(paid),function(o){return o.total});
  var att=sum(ord.filter(function(o){return o.status==="En attente"}),function(o){return o.total});
  var low=S.products.filter(function(p){return p.stock<=p.min});
  var pl={today:"Aujourd'hui","7":"7 jours","30":"30 jours",all:"Tout"};
  var seg=Object.keys(pl).map(function(k){return '<button data-act="period" data-v="'+k+'" aria-pressed="'+(ui.period===k)+'">'+pl[k]+'</button>'}).join("");

  // 7 derniers jours
  var days=[],max=1,i;
  for(i=6;i>=0;i--){
    var d0=sod(Date.now())-i*DAY;
    var v=sum(S.orders.filter(function(o){return paid(o)&&sod(o.date)===d0}),function(o){return o.total});
    days.push({d:d0,v:v});if(v>max)max=v;
  }
  var bars=days.map(function(x,k){
    var h=Math.round((x.v/max)*110), bx=14+k*47;
    var lab=new Date(x.d).toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","");
    return '<rect x="'+bx+'" y="'+(130-h)+'" width="28" height="'+Math.max(h,x.v?2:1)+'" rx="2" fill="'+(x.v?'#e6e8ec':'#2a2a2a')+'"/>'
      +(x.v?'<text class="val" x="'+(bx+14)+'" y="'+(124-h)+'">'+compact(x.v)+'</text>':'')
      +'<text x="'+(bx+14)+'" y="148">'+esc(lab)+'</text>';
  }).join("");

  // meilleures ventes
  var agg={};
  live.forEach(function(o){o.items.forEach(function(it){var a=agg[it.name]||(agg[it.name]={q:0,r:0});a.q+=it.qty;a.r+=it.qty*it.price})});
  var top=Object.keys(agg).map(function(k){return {n:k,q:agg[k].q,r:agg[k].r}}).sort(function(a,b){return b.q-a.q}).slice(0,4);
  var topH=top.length?top.map(function(t){return '<div class="row"><span class="a">'+esc(t.n)+'</span><span class="b">'+t.q+' vendu'+(t.q>1?'s':'')+' · '+money(t.r)+'</span></div>'}).join(""):'<div class="empty">Aucune vente sur cette période.</div>';
  var lowH=low.length?low.map(function(p){return '<div class="row"><span class="a">'+esc(p.name)+'</span><span class="b alert">'+(p.stock===0?'Rupture':p.stock+' en stock')+'</span></div>'}).join(""):'<div class="empty">Tous vos stocks sont au-dessus du seuil.</div>';
  var recent=S.orders.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date)}).slice(0,5);
  var recH=recent.length?recent.map(function(o){return '<div class="row"><span><span class="a">'+esc(o.no)+'</span> <span class="muted">'+esc(o.client)+'</span></span><span><span class="badge '+stClass(o.status)+'">'+o.status+'</span></span></div>'}).join(""):'<div class="empty">Aucune commande pour le moment.</div>';

  return '<section class="hero blk"><div class="lbl">Encaissé</div>'
    +'<div class="big">'+Math.round(enc).toLocaleString("fr-FR")+'<small>FC</small></div>'
    +'<div class="muted small">'+live.length+' commande'+(live.length>1?'s':'')+' sur la période</div>'
    +'<div class="seg" role="group" aria-label="Période">'+seg+'</div></section>'
    +'<div class="metrics"><div><div class="v">'+money(att)+'</div><div class="k">À encaisser</div></div>'
    +'<div><div class="v">'+live.length+'</div><div class="k">Commandes</div></div>'
    +'<div><div class="v'+(low.length?' alert':'')+'">'+low.length+'</div><div class="k">Stock bas</div></div></div>'
    +'<section class="blk"><h2>Ventes des 7 derniers jours</h2>'
    +'<svg class="chart" viewBox="0 0 350 156" role="img" aria-label="Encaissements par jour sur 7 jours">'+bars+'</svg></section>'
    +'<div class="cols"><section class="blk"><h2>Meilleures ventes</h2>'+topH+'</section>'
    +'<section class="blk"><h2>Stocks à surveiller</h2>'+lowH+'</section></div>'
    +'<section class="blk"><h2>Dernières commandes</h2>'+recH
    +'<div style="margin-top:14px"><button class="btn ghost small" data-act="go" data-v="orders">Voir toutes les commandes</button></div></section>'
    +'<section class="blk"><h2>Données</h2><p class="muted small" style="margin-top:0">Les données restent dans ce navigateur. Les chiffres actuels sont des exemples : effacez-les pour commencer avec vos vraies ventes.</p>'
    +'<div class="tools"><button class="btn ghost small" data-act="reset-demo">'+(ui.armed==="demo"?'Confirmer : recharger la démo':'Recharger la démo')+'</button>'
    +'<button class="btn ghost small danger" data-act="wipe">'+(ui.armed==="wipe"?'Confirmer : tout effacer':'Tout effacer')+'</button></div></section>';
}

function orderList(){
  var q=ui.q.trim().toLowerCase();
  var list=S.orders.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date)}).filter(function(o){
    if(ui.filter!=="Tous"&&o.status!==ui.filter)return false;
    if(!q)return true;
    return (o.no+" "+o.client+" "+o.phone+" "+summary(o)).toLowerCase().indexOf(q)>-1;
  });
  if(!list.length)return '<div class="empty">'+(S.orders.length?'Aucune commande ne correspond à cette recherche.':'Aucune commande pour le moment. Ajoutez votre première vente.')+'</div>';
  return list.map(function(o){
    var opts=STATUTS.map(function(s){return '<option'+(s===o.status?' selected':'')+'>'+s+'</option>'}).join("");
    var armed=ui.armed==="del-"+o.id;
    return '<article class="ord"><div class="ord-top"><strong>'+esc(o.no)+'</strong><span class="muted small">'+fdate(o.date)+' · '+esc(o.pay)+'</span></div>'
      +'<div class="cl">'+esc(o.client)+(o.phone?' <span class="muted small">'+esc(o.phone)+'</span>':'')+'</div>'
      +'<div class="it">'+esc(summary(o))+'</div>'
      +'<div class="ord-bot"><span class="amt">'+money(o.total)+'</span>'
      +'<select aria-label="Statut de '+esc(o.no)+'" data-act="status" data-id="'+o.id+'">'+opts+'</select>'
      +'<button class="btn ghost small'+(armed?' danger':'')+'" data-act="del" data-id="'+o.id+'">'+(armed?'Confirmer la suppression':'Supprimer')+'</button></div></article>';
  }).join("");
}
function vOrders(){
  var f=["Tous"].concat(STATUTS).map(function(s){return '<button data-act="filter" data-v="'+s+'" aria-pressed="'+(ui.filter===s)+'">'+s+'</button>'}).join("");
  return '<section class="blk"><h1>Commandes</h1></section>'
    +'<div class="tools"><input class="input" id="q" type="search" placeholder="Chercher un numéro, un client ou un article" value="'+esc(ui.q)+'" aria-label="Rechercher une commande"></div>'
    +'<div class="chips" role="group" aria-label="Filtrer par statut">'+f+'</div>'
    +'<div id="orderList">'+orderList()+'</div>';
}

function vStock(){
  var rows=S.products.map(function(p){
    var low=p.stock<=p.min, open=ui.edit===p.id, armed=ui.armed==="delp-"+p.id;
    var ed=open?'<div class="edit"><div class="field full"><label for="n-'+p.id+'">Nom du produit</label><input class="input" id="n-'+p.id+'" value="'+esc(p.name)+'"></div>'
      +'<div class="field"><label for="pr-'+p.id+'">Prix (FC)</label><input class="input" id="pr-'+p.id+'" type="number" inputmode="numeric" min="0" value="'+p.price+'"></div>'
      +'<div class="field"><label for="mi-'+p.id+'">Alerte sous</label><input class="input" id="mi-'+p.id+'" type="number" inputmode="numeric" min="0" value="'+p.min+'"></div>'
      +'<div class="act"><button class="btn small" data-act="save-prod" data-id="'+p.id+'">Enregistrer</button>'
      +'<button class="btn ghost small'+(armed?' danger':'')+'" data-act="del-prod" data-id="'+p.id+'">'+(armed?'Confirmer la suppression':'Supprimer le produit')+'</button></div></div>':'';
    return '<div class="prod"><div class="prod-top"><div><div class="nm">'+esc(p.name)+'</div><div class="pr">'+money(p.price)+(low?' · <span class="alert">'+(p.stock===0?'Rupture':'Stock bas')+'</span>':'')+'</div></div>'
      +'<div class="qty'+(low?' low':'')+'"><button data-act="dec" data-id="'+p.id+'" aria-label="Retirer une unité">−</button><span aria-live="polite">'+p.stock+'</span><button data-act="inc" data-id="'+p.id+'" aria-label="Ajouter une unité">+</button></div></div>'
      +'<div style="margin-top:10px"><button class="btn ghost small" data-act="edit" data-id="'+p.id+'">'+(open?'Fermer':'Modifier')+'</button></div>'+ed+'</div>';
  }).join("");
  return '<section class="blk"><h1>Stocks</h1><p class="muted" style="margin:8px 0 0">Le stock baisse automatiquement à chaque vente et remonte si une commande est annulée.</p></section>'
    +(rows||'<div class="empty">Aucun produit. Ajoutez-en un ci-dessous.</div>')
    +'<section class="blk"><h2>Nouveau produit</h2><div class="form">'
    +'<div class="field"><label for="np-n">Nom du produit</label><input class="input" id="np-n" placeholder="Ex. Polo blanc"></div>'
    +'<div class="two"><div class="field"><label for="np-p">Prix (FC)</label><input class="input" id="np-p" type="number" inputmode="numeric" min="0" placeholder="25000"></div>'
    +'<div class="field"><label for="np-s">Quantité en stock</label><input class="input" id="np-s" type="number" inputmode="numeric" min="0" placeholder="10"></div></div>'
    +'<div class="field"><label for="np-m">Alerte quand il reste</label><input class="input" id="np-m" type="number" inputmode="numeric" min="0" value="5"></div>'
    +'<div class="err" id="np-err" role="alert"></div>'
    +'<button class="btn" data-act="add-prod">Ajouter le produit</button></div></section>';
}

function lineTotal(l){var p=prod(l.pid);return p?p.price*l.qty:0}
function draftTotal(){return sum(D.lines,lineTotal)}
function vAdd(){
  var done=ui.last?'<div class="done"><div class="muted small">Vente enregistrée</div><div class="no">'+esc(ui.last)+'</div>'
    +'<p class="muted small" style="margin:6px 0 12px">Donnez ce numéro au client : il l’associera à sa capture de paiement.</p>'
    +'<button class="btn ghost small" data-act="go" data-v="orders">Voir les commandes</button></div>':'';
  var lines=D.lines.map(function(l,k){
    var opts='<option value="">Choisir un article</option>'+S.products.map(function(p){
      return '<option value="'+p.id+'"'+(p.id===l.pid?' selected':'')+(p.stock===0?' disabled':'')+'>'+esc(p.name)+' ('+p.stock+' en stock)</option>';
    }).join("");
    return '<div class="line"><div class="field"><label for="ln-'+k+'">Article '+(D.lines.length>1?(k+1):'')+'</label><select class="input" id="ln-'+k+'" data-f="line-pid" data-k="'+k+'">'+opts+'</select></div>'
      +'<div class="field"><label for="lq-'+k+'">Quantité</label><input class="input" id="lq-'+k+'" type="number" inputmode="numeric" min="1" value="'+l.qty+'" data-f="line-qty" data-k="'+k+'"></div>'
      +(D.lines.length>1?'<button type="button" class="btn ghost small" data-act="rm-line" data-k="'+k+'" aria-label="Retirer cet article">Retirer</button>':'<span></span>')
      +'<div class="sub" id="ls-'+k+'">'+(l.pid?money(lineTotal(l)):'')+'</div></div>';
  }).join("");
  var pay=PAIEMENTS.map(function(s){return '<option'+(s===D.pay?' selected':'')+'>'+s+'</option>'}).join("");
  var st=STATUTS.slice(0,3).map(function(s){return '<option'+(s===D.status?' selected':'')+'>'+s+'</option>'}).join("");
  return '<section class="blk"><h1>Ajouter une vente</h1></section>'+done
    +'<div class="form">'
    +'<div class="two"><div class="field"><label for="f-client">Nom du client</label><input class="input" id="f-client" data-f="client" value="'+esc(D.client)+'" autocomplete="off"></div>'
    +'<div class="field"><label for="f-phone">Téléphone (facultatif)</label><input class="input" id="f-phone" data-f="phone" type="tel" value="'+esc(D.phone)+'"></div></div>'
    +lines
    +'<div><button type="button" class="btn ghost small" data-act="add-line">Ajouter un article</button></div>'
    +'<div class="two"><div class="field"><label for="f-pay">Moyen de paiement</label><select class="input" id="f-pay" data-f="pay">'+pay+'</select></div>'
    +'<div class="field"><label for="f-st">Statut</label><select class="input" id="f-st" data-f="status">'+st+'</select></div></div>'
    +'<div class="total"><span class="muted">Total</span><span class="v" id="dtotal">'+money(draftTotal())+'</span></div>'
    +'<div class="err" id="f-err" role="alert">'+esc(ui.error)+'</div>'
    +'<button class="btn block" data-act="submit-sale">Enregistrer la vente</button></div>';
}

/* ---------- Rendu ---------- */
function render(){
  var nav=document.getElementById("nav");
  nav.innerHTML=TABS.map(function(t){
    return '<button data-act="go" data-v="'+t[0]+'"'+(ui.view===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[t[0]]+'</svg><span>'+t[1]+'</span></button>';
  }).join("");
  var v=ui.view==="overview"?vOverview():ui.view==="orders"?vOrders():ui.view==="stock"?vStock():vAdd();
  document.getElementById("app").innerHTML=v+'<p class="foot">Shopy Trend · Les données restent dans ce navigateur</p>';
}
function go(v){ui.view=v;ui.armed="";ui.error="";if(v!=="add")ui.last=ui.last;render();window.scrollTo(0,0)}

/* ---------- Événements ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t||t.tagName==="SELECT")return;
  var a=t.getAttribute("data-act"),id=t.getAttribute("data-id"),v=t.getAttribute("data-v"),k=parseInt(t.getAttribute("data-k"),10);
  if(a==="go"){if(v==="add")ui.last="";go(v);return}
  if(a==="period"){ui.period=v;render();return}
  if(a==="filter"){ui.filter=v;render();return}
  if(a==="del"){
    if(ui.armed==="del-"+id){
      var o=S.orders.filter(function(x){return x.id===id})[0];
      if(o&&o.status!=="Annulée")changeStock(o,1);
      S.orders=S.orders.filter(function(x){return x.id!==id});ui.armed="";save();render();toast("Commande supprimée");
    }else{ui.armed="del-"+id;render()}
    return;
  }
  if(a==="inc"||a==="dec"){var p=prod(id);if(p){p.stock=Math.max(0,p.stock+(a==="inc"?1:-1));save();render()}return}
  if(a==="edit"){ui.edit=ui.edit===id?"":id;ui.armed="";render();return}
  if(a==="save-prod"){
    var q=prod(id),nm=document.getElementById("n-"+id).value.trim(),pr=parseInt(document.getElementById("pr-"+id).value,10),mi=parseInt(document.getElementById("mi-"+id).value,10);
    if(!nm||isNaN(pr)||pr<0){toast("Nom et prix valides requis");return}
    q.name=nm;q.price=pr;q.min=isNaN(mi)?0:mi;ui.edit="";save();render();toast("Produit enregistré");return;
  }
  if(a==="del-prod"){
    if(ui.armed==="delp-"+id){S.products=S.products.filter(function(x){return x.id!==id});ui.armed="";ui.edit="";save();render();toast("Produit supprimé")}
    else{ui.armed="delp-"+id;render()}
    return;
  }
  if(a==="add-prod"){
    var n=document.getElementById("np-n").value.trim(),pp=parseInt(document.getElementById("np-p").value,10),ss=parseInt(document.getElementById("np-s").value,10),mm=parseInt(document.getElementById("np-m").value,10);
    var err=document.getElementById("np-err");
    if(!n){err.textContent="Saisissez le nom du produit.";return}
    if(isNaN(pp)||pp<0){err.textContent="Saisissez un prix en francs congolais.";return}
    if(isNaN(ss)||ss<0){err.textContent="Saisissez la quantité en stock.";return}
    S.products.push({id:"p"+Date.now(),name:n,price:pp,stock:ss,min:isNaN(mm)?0:mm});save();render();toast("Produit ajouté");return;
  }
  if(a==="add-line"){D.lines.push({pid:"",qty:1});render();return}
  if(a==="rm-line"){D.lines.splice(k,1);render();return}
  if(a==="submit-sale"){submit();return}
  if(a==="reset-demo"){if(ui.armed==="demo"){S=demo();ui.armed="";save();render();toast("Données de démo rechargées")}else{ui.armed="demo";render()}return}
  if(a==="wipe"){if(ui.armed==="wipe"){S={products:[],orders:[],seq:1};ui.armed="";save();render();toast("Données effacées")}else{ui.armed="wipe";render()}return}
});

document.addEventListener("change",function(e){
  var t=e.target,a=t.getAttribute("data-act"),f=t.getAttribute("data-f");
  if(a==="status"){
    var o=S.orders.filter(function(x){return x.id===t.getAttribute("data-id")})[0],ns=t.value;if(!o||o.status===ns)return;
    if(o.status!=="Annulée"&&ns==="Annulée")changeStock(o,1);
    if(o.status==="Annulée"&&ns!=="Annulée")changeStock(o,-1);
    o.status=ns;save();render();toast(o.no+" : "+ns);return;
  }
  if(f==="line-pid"){D.lines[+t.getAttribute("data-k")].pid=t.value;refreshTotals();}
  else if(f==="pay"){D.pay=t.value}
  else if(f==="status"){D.status=t.value}
});
document.addEventListener("input",function(e){
  var t=e.target,f=t.getAttribute("data-f");
  if(t.id==="q"){ui.q=t.value;document.getElementById("orderList").innerHTML=orderList();return}
  if(f==="client")D.client=t.value;
  else if(f==="phone")D.phone=t.value;
  else if(f==="line-qty"){var n=parseInt(t.value,10);D.lines[+t.getAttribute("data-k")].qty=isNaN(n)||n<1?1:n;refreshTotals()}
});
function refreshTotals(){
  D.lines.forEach(function(l,k){var el=document.getElementById("ls-"+k);if(el)el.textContent=l.pid?money(lineTotal(l)):""});
  var d=document.getElementById("dtotal");if(d)d.textContent=money(draftTotal());
}

function submit(){
  var err=document.getElementById("f-err");
  function fail(m){ui.error=m;err.textContent=m}
  if(!D.client.trim())return fail("Saisissez le nom du client.");
  var lines=D.lines.filter(function(l){return l.pid});
  if(!lines.length)return fail("Choisissez au moins un article.");
  var need={};
  for(var i=0;i<lines.length;i++){need[lines[i].pid]=(need[lines[i].pid]||0)+lines[i].qty}
  for(var pid in need){var p=prod(pid);if(need[pid]>p.stock)return fail("Stock insuffisant pour « "+p.name+" » : il en reste "+p.stock+".")}
  var items=lines.map(function(l){var p=prod(l.pid);return {pid:p.id,name:p.name,qty:l.qty,price:p.price}});
  var no="ST-"+pad(S.seq);
  var order={id:"o"+S.seq,no:no,date:new Date().toISOString(),client:D.client.trim(),phone:D.phone.trim(),items:items,
    total:sum(items,function(i){return i.qty*i.price}),pay:D.pay,status:D.status};
  S.seq++;S.orders.push(order);changeStock(order,-1);save();
  ui.last=no;ui.error="";D=freshDraft();render();window.scrollTo(0,0);toast("Vente "+no+" enregistrée");
}

render();
})();
</script>
</body>
</html>
