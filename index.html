<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopy Trend — Business Manager</title>
<style>
:root{--navy:#101b2b;--panel:#1b2b40;--panel2:#29394d;--gold:#e5c88e;--muted:#b5c2d4;--white:#fff;--line:#344154}
*{box-sizing:border-box}body{margin:0;background:#0b1421;color:var(--white);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--gold);color:#101b2b;font-weight:650}
button.secondary{background:transparent;color:#fff;border:1px solid #607087}button:hover{filter:brightness(1.07)}
.app{max-width:1050px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:13px;padding:16px 0 22px;border-bottom:1px solid var(--line)}
.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:13px;background:var(--gold);color:var(--navy);font-size:24px}
h1{font-size:22px;letter-spacing:1px;margin:0}h2{font-size:22px;margin:0 0 6px}h3{font-size:17px;margin:0}p{color:var(--muted);margin:5px 0}
.pill{margin-left:auto;border:1px solid #3e735c;background:#173b30;color:#b4f1d2;border-radius:20px;padding:5px 10px;font-size:12px}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;padding-top:20px}.nav{display:flex;flex-direction:column;gap:7px}
.nav button{background:#172437;color:#c4d0df;text-align:left;font-weight:500}.nav button.active{background:var(--panel2);color:white;border-left:3px solid var(--gold)}
main{min-width:0}.section-head{margin-bottom:17px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.card,.order,.product{background:var(--panel);border-radius:14px;padding:16px}.metric-label{font-size:13px;color:var(--muted)}.metric{font-size:28px;font-weight:750;margin:8px 0}.gold{color:var(--gold)}.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.order,.product{display:grid;gap:12px}.status{border-radius:20px;padding:4px 9px;font-size:12px;white-space:nowrap;background:#35465b;color:#e1eaf5}.status.P payee{background:#173b30}
input,select{width:100%;border:1px solid #45566d;border-radius:9px;background:#101b2b;color:white;padding:11px;margin-top:6px}
label{display:block;color:#d4deea;font-size:13px;margin-top:8px}.form{display:grid;gap:12px;max-width:600px}.radios{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.radios label{margin:0;display:flex;gap:6px;align-items:center}.radios input{width:auto;margin:0}
.notice{background:#29394d;border-radius:10px;padding:12px;color:#fff;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{color:var(--muted);padding:20px;text-align:center;background:var(--panel);border-radius:12px}
footer{text-align:center;color:#8fa2b8;font-size:12px;padding:25px 0 8px;border-top:1px solid var(--line);margin-top:25px}
@media(max-width:650px){.app{padding:14px}.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{font-size:13px;padding:10px}.cards{gap:9px}.card{padding:13px}.metric{font-size:23px}.top{padding-top:6px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">🛍</div><div><h1>SHOPy TREND</h1><p>BUSINESS MANAGER · DÉMO</p></div><span class="pill">Prototype interactif</span></header>
<div class="layout">
<nav class="nav" aria-label="Navigation">
<button class="active" data-tab="dashboard">▦ &nbsp; Vue d'ensemble</button>
<button data-tab="orders">🛒 &nbsp; Commandes</button>
<button data-tab="stock">📦 &nbsp; Stocks</button>
<button data-tab="add">＋ &nbsp; Ajouter une vente</button>
</nav>
<main id="content"></main>
</div>
<footer>SHOPY TREND · Prototype interactif · Données fictives · Les données restent dans ce navigateur</footer>
</div>
<script>
const starterOrders=[
{id:"ST-1001",client:"Sarah M.",produit:"Sac à main",montant:35,statut:"Payée"},
{id:"ST-1002",client:"David K.",produit:"Ensemble tendance",montant:55,statut:"En attente"},
{id:"ST-1003",client:"Merveille L.",produit:"Chaussures",montant:45,statut:"Expédiée"}
];
const starterStock=[
{nom:"Sacs à main",quantite:12,prix:35},
{nom:"Ensembles tendance",quantite:8,prix:55},
{nom:"Chaussures",quantite:5,prix:45}
];
let orders=load("st_orders",starterOrders),stock=load("st_stock",starterStock),tab="dashboard",notice="";
function load(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback.map(x=>({...x}))}catch(e){return fallback.map(x=>({...x}))}}
function save(){localStorage.setItem("st_orders",JSON.stringify(orders));localStorage.setItem("st_stock",JSON.stringify(stock))}
function money(n){return "$"+Number(n).toLocaleString("en-US")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function statusOptions(current){return ["En attente","Payée","Expédiée","Livrée","Annulée"].map(s=>`<option ${s===current?"selected":""}>${s}</option>`).join("")}
function render(){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 const root=document.getElementById("content");
 if(tab==="dashboard"){
 const total=orders.reduce((a,o)=>a+Number(o.montant),0),pending=orders.filter(o=>o.statut==="En attente").length,units=stock.reduce((a,p)=>a+Number(p.quantite),0);
 root.innerHTML=`<div class="section-head"><h2>Tableau de bord</h2><p>Bienvenue dans ton espace commercial.</p></div>
 <div class="cards">
 <div class="card"><div class="metric-label">Ventes enregistrées</div><div class="metric">${money(total)}</div><div class="muted">Montant des commandes de la démo</div></div>
 <div class="card"><div class="metric-label">Commandes</div><div class="metric">${orders.length}</div><div class="muted">${pending} en attente</div></div>
 <div class="card"><div class="metric-label">Références produits</div><div class="metric">${stock.length}</div><div class="muted">${units} articles en stock</div></div>
 <div class="card"><div class="metric-label">À traiter</div><div class="metric">${pending}</div><div class="muted">Commandes en attente</div></div></div>
 <div class="row" style="margin:22px 0 12px"><h3>Commandes récentes</h3><button class="secondary" data-action="goto-orders">Tout voir</button></div>
 <div class="stack">${orders.slice(-3).reverse().map(orderCard).join("")||'<div class="empty">Aucune commande pour le moment.</div>'}</div>
 <div style="margin-top:14px"><button data-action="goto-add">＋ Enregistrer une commande</button></div>`;
 }else if(tab==="orders"){
 root.innerHTML=`<div class="section-head"><h2>Gestion des commandes</h2><p>Consulte les commandes et modifie leur statut.</p></div>
 <div class="stack">${orders.slice().reverse().map(orderCard).join("")||'<div class="empty">Aucune commande. Ajoute ta première vente.</div>'}</div>
 <div style="margin-top:14px"><button data-action="goto-add">＋ Ajouter une commande</button></div>`;
 }else if(tab==="stock"){
 root.innerHTML=`<div class="section-head"><h2>Gestion des stocks</h2><p>Ajuste les quantités et ajoute des produits. Les changements sont conservés dans ce navigateur.</p></div>
 <div class="stack">${stock.map((p,i)=>`<div class="product"><div class="row"><div><h3>${esc(p.nom)}</h3><p>Prix de vente : ${money(p.prix)}</p></div><div style="text-align:right"><div class="metric ${p.quantite<=5?"gold":""}" style="font-size:24px;margin:0">${p.quantite}</div><div class="muted">en stock</div></div></div><div class="actions"><button class="secondary" data-action="minus" data-index="${i}">− Retirer 1</button><button data-action="plus" data-index="${i}">＋ Ajouter 1</button></div></div>`).join("")}
 <div class="card"><h3>Nouveau produit</h3><form id="product-form" class="form"><div><label for="pname">Nom du produit</label><input id="pname" required placeholder="Ex. Chemise classique"></div><div><label for="pqty">Quantité initiale</label><input id="pqty" type="number" min="0" step="1" value="1" required></div><div><label for="pprice">Prix de vente ($)</label><input id="pprice" type="number" min="0.01" step="0.01" required placeholder="Ex. 25"></div><button>Ajouter au catalogue</button></form>${notice?`<div class="notice">${esc(notice)}</div>`:""}</div></div>`;
 }else{
 root.innerHTML=`<div class="section-head"><h2>Nouvelle commande</h2><p>Enregistre une vente dans la démo.</p></div>
 <div class="card"><form id="order-form" class="form">
 <div><label for="client">Nom du client</label><input id="client" required placeholder="Ex. Grâce M."></div>
 <div><label for="product">Produit commandé</label><input id="product" required placeholder="Ex. Sac à main"></div>
 <div><label for="amount">Montant de la vente ($)</label><input id="amount" type="number" min="0.01" step="0.01" required placeholder="Ex. 35"></div>
 <div><label for="state">Statut de la commande</label><select id="state"><option>En attente</option><option>Payée</option><option>Expédiée</option><option>Livrée</option></select></div>
 <button>✓ Enregistrer la commande</button></form>${notice?`<div class="notice">${esc(notice)}</div>`:""}</div>`;
 }
}
function orderCard(o){return `<div class="order"><div class="row"><div><h3>${esc(o.produit)}</h3><p>${esc(o.client)} · ${esc(o.id)}</p></div><strong class="gold">${money(o.montant)}</strong></div><div class="row"><span class="muted">Statut</span><select data-order="${esc(o.id)}" aria-label="Statut de ${esc(o.id)}">${statusOptions(o.statut)}</select></div></div>`}
document.querySelector(".nav").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;notice="";render()}});
document.getElementById("content").addEventListener("click",e=>{
 const b=e.target.closest("button[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="goto-orders")tab="orders";
 else if(a==="goto-add"){tab="add";notice=""}
 else if(a==="plus"||a==="minus"){const p=stock[Number(b.dataset.index)];if(p){p.quantite=Math.max(0,p.quantite+(a==="plus"?1:-1));save()}}
 render();
});
document.getElementById("content").addEventListener("change",e=>{
 if(e.target.matches("select[data-order]")){const o=orders.find(x=>x.id===e.target.dataset.order);if(o){o.statut=e.target.value;save();render()}}
});
document.getElementById("content").addEventListener("submit",e=>{
 e.preventDefault();
 if(e.target.id==="order-form"){
 const client=document.getElementById("client").value.trim(),produit=document.getElementById("product").value.trim(),montant=Number(document.getElementById("amount").value),statut=document.getElementById("state").value;
 const next=Math.max(1000,...orders.map(o=>Number(o.id.replace("ST-",""))||1000))+1;
 orders.push({id:"ST-"+next,client,produit,montant,statut});save();tab="orders";notice="Commande enregistrée.";render();
 }else if(e.target.id==="product-form"){
 const nom=document.getElementById("pname").value.trim(),quantite=Number(document.getElementById("pqty").value),prix=Number(document.getElementById("pprice").value);
 if(stock.some(p=>p.nom.toLowerCase()===nom.toLowerCase())){notice="Ce produit existe déjà dans le catalogue."}
 else{stock.push({nom,quantite,prix});save();notice="Produit ajouté au catalogue."}
 render();
 }
});
render();
</script>
</body>
</html>
